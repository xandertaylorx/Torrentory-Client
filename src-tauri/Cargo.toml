[package]
name = "torrentory-client"
version = "0.1.8"
description = "A minimal, native BitTorrent client from Torrentory"
authors = ["Torrentory"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torrentory_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librqbit = "8.1.1"
bencode = { package = "librqbit-bencode", version = "3.1", default-features = false }
async-trait = "0.1.91"
anyhow = "1.0.104"
directories = "6.0.0"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "net", "io-util"] }
url = "2.5.8"
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
reqwest = "0.12"
tempfile = "3"
