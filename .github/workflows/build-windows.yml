name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build x64 NSIS installer and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build --bundles nsis

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS installer" }
          New-Item -ItemType Directory -Force -Path windows-release | Out-Null
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "Updater signing did not produce a signature" }
          Copy-Item $installer.FullName "windows-release/Torrentory-Client_${version}_x64-setup.exe"
          Copy-Item $signature "windows-release/Torrentory-Client_${version}_x64-setup.exe.sig"

      - name: Save installer for release preparation
        uses: actions/upload-artifact@v4
        with:
          name: torrentory-windows-x64
          path: windows-release/*
          if-no-files-found: error
